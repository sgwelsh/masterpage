<!DOCTYPE html>
<html lang="en">
<head>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Community Risk Reduction</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a2a6c, #b21f1f, #fdbb2d);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        .emblem {
            margin-top: 30px;
            margin-bottom: 20px;
            max-width: 200px;
            width: 100%;
            height: auto;
            border-radius: 50%;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            animation: float 6s ease-in-out infinite;
            border: 3px solid rgba(255, 255, 255, 0.8);
            background-color: white;
        }
        
        .title {
            font-size: 3.5rem;
            font-weight: 700;
            color: #fff;
            text-align: center;
            margin-bottom: 40px;
            text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.5);
            letter-spacing: 1px;
            position: relative;
            padding: 0 20px;
        }
        
        .title::after {
            content: '';
            position: absolute;
            bottom: -25px;
            left: 50%;
            transform: translateX(-50%);
            width: 500px;
            height: 3px;
            background: linear-gradient(90deg, #ff9a56, #ff6a88, #d57eeb);
            border-radius: 10px;
        }
        
        .subheadings {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            width: 100%;
            margin-top: 20px;
            margin-bottom: 40px;
        }
        
        .subheading {
            background: rgba(255, 255, 255, 0.9);
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            transition: all 0.3s ease;
            height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .subheading:hover {
            transform: translateY(-5px);
            background: linear-gradient(45deg, #f093fb, #f5576c);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
        }
        
        .subheading a {
            text-decoration: none;
            color: #333;
            font-size: 1.2rem;
            font-weight: 500;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .subheading:hover a {
            color: white;
        }
        
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }
        
        @media (max-width: 768px) {
            .title { font-size: 2.5rem; }
            .subheadings { grid-template-columns: 1fr; }
        }
        
        .loading-message {
            color: white;
            font-size: 1.5rem;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="title">Hazelwood Fire Department<br>Fire Marshal Dashboard</h1>
        
        <!-- Loading message will be shown while buttons are being loaded -->
        <div class="loading-message" id="loadingMessage">Loading dashboard...</div>
        
        <!-- Buttons will be dynamically added here -->
        <div class="subheadings" id="buttonContainer">
            <!-- Buttons will be inserted here by JavaScript -->
        </div>
        
        <img class="emblem" src="https://github.com/sgwelsh/Media/blob/main/VeniceAI_Os8SsvW.png?raw=true" alt="Community Risk Reduction Emblem">
    </div>

    <script>
        // Wait for page to load
        document.addEventListener('DOMContentLoaded', function() {
            const buttonContainer = document.getElementById('buttonContainer');
            const loadingMessage = document.getElementById('loadingMessage');
            
            // Function to parse CSV line, handling quoted fields with commas
            function parseCSVLine(line) {
                const result = [];
                let current = '';
                let inQuotes = false;
                
                for (let i = 0; i < line.length; i++) {
                    const char = line[i];
                    const nextChar = line[i+1];
                    
                    if (char === '"' && inQuotes && nextChar === '"') {
                        // Escaped quote within quoted field
                        current += '"';
                        i++; // Skip the next quote
                    } else if (char === '"') {
                        // Start or end of quoted field
                        inQuotes = !inQuotes;
                    } else if (char === ',' && !inQuotes) {
                        // Field separator
                        result.push(current.trim());
                        current = '';
                    } else {
                        // Regular character
                        current += char;
                    }
                }
                
                // Add the last field
                result.push(current.trim());
                return result;
            }
            
            // Function to load buttons from CSV
            function loadButtonsFromCSV() {
                // Try to load from local CSV first
                fetch('buttons.csv')
                    .then(response => {
                        if (!response.ok) throw new Error('Local CSV not found');
                        return response.text();
                    })
                    .then(csvData => {
                        processCSVAndCreateButtons(csvData);
                        loadingMessage.style.display = 'none';
                    })
                    .catch(error => {
                        // If local fails, try GitHub
                        fetch('https://raw.githubusercontent.com/sgwelsh/hazelwood-fire-dashboard/main/buttons.csv')
                            .then(response => {
                                if (!response.ok) throw new Error('GitHub CSV not found');
                                return response.text();
                            })
                            .then(csvData => {
                                processCSVAndCreateButtons(csvData);
                                loadingMessage.style.display = 'none';
                            })
                            .catch(error => {
                                loadingMessage.textContent = 'Error loading dashboard data. Please check your CSV file.';
                            });
                    });
            }
            
            // Function to process CSV and create buttons
            function processCSVAndCreateButtons(csvData) {
                // Parse CSV - each line has format: ButtonName,Hyperlink
                const lines = csvData.split('\n');
                
                // Process ALL rows including the first one
                for (let i = 0; i < lines.length; i++) {
                    const line = lines[i].trim();
                    if (!line) continue; // Skip empty lines
                    
                    // Use the parseCSVLine function to handle commas in URLs
                    const parts = parseCSVLine(line);
                    
                    if (parts.length < 2) continue; // Skip malformed lines
                    
                    const buttonName = parts[0];
                    const buttonLink = parts[1];
                    
                    // Check if it's a CSV page link (ends with .html) or external link
                    const isCSVLink = buttonLink.endsWith('.html');
                    
                    // Create button element
                    const buttonDiv = document.createElement('div');
                    buttonDiv.className = 'subheading';
                    
                    const buttonLinkElement = document.createElement('a');
                    buttonLinkElement.textContent = buttonName;
                    buttonLinkElement.href = buttonLink;
                    
                    if (isCSVLink) {
                        // This is a page link, not an external resource
                        buttonLinkElement.target = '_self';
                    } else {
                        // This is an external resource
                        buttonLinkElement.target = '_blank';
                    }
                    
                    buttonDiv.appendChild(buttonLinkElement);
                    buttonContainer.appendChild(buttonDiv);
                }
            }
            
            // Start the process
            loadButtonsFromCSV();
        });
    </script>
</body>
</html>
