<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hazelwood Fire District Map - GeoLibre</title>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a2a6c, #b21f1f, #fdbb2d);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        .container {
            max-width: 100%;
            width: 100%;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            padding: 10px;
        }
        
        .header {
            text-align: center;
            padding: 15px;
            color: white;
        }
        
        .title {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 10px;
            text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.5);
        }
        
        .subtitle {
            font-size: 1.2rem;
            margin-bottom: 15px;
        }
        
        .map-container {
            flex-grow: 1;
            background: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            min-height: 600px;
            position: relative;
        }
        
        .iframe-container {
            width: 100%;
            height: 100%;
            min-height: 600px;
        }
        
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        
        .footer {
            text-align: center;
            padding: 10px;
            color: rgba(255, 255, 255, 0.8);
        }
        
        .instructions {
            position: absolute;
            bottom: 10px;
            left: 10px;
            z-index: 1000;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 8px;
            font-size: 12px;
            border-radius: 5px;
            max-width: 300px;
        }
        
        .controls {
            position: absolute;
            top: 10px;
            right: 10px;
            z-index: 1000;
            background: rgba(255, 255, 255, 0.9);
            padding: 8px;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }
        
        .button {
            background: rgba(255, 255, 255, 0.9);
            color: #333;
            border: none;
            padding: 8px 15px;
            margin: 0 5px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s ease;
        }
        
        .button:hover {
            background: linear-gradient(45deg, #f093fb, #f5576c);
            color: white;
        }
        
        @media (max-width: 768px) {
            .title { font-size: 1.8rem; }
            .subtitle { font-size: 1rem; }
            .button { 
                padding: 6px 10px;
                font-size: 12px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1 class="title">Hazelwood Fire District Map</h1>
            <div class="subtitle">City of Hazelwood, Missouri</div>
        </div>
        
        <div class="map-container">
            <div class="iframe-container">
                <!-- GeoLibre iframe with default view centered on Hazelwood, MO -->
                <iframe 
                    src="https://web.geolibre.app/#lat=38.787950&lng=-90.374537&zoom=13"
                    title="Hazelwood Fire District Map"
                ></iframe>
            </div>
            
            <div id="instructions">
                <strong>Instructions:</strong><br>
                Click on the map to add pins.<br>
                Click on pins to edit or delete them.<br>
                Use the map controls to navigate.<br>
                All changes are saved automatically.
            </div>
            
            <div class="controls">
                <button class="button" onclick="resetView()">Reset View</button>
                <button class="button" onclick="openInNewTab()">Open in New Tab</button>
            </div>
        </div>
        
        <div class="footer">
            <p>Hazelwood Fire Department | Fire Marshal Division</p>
        </div>
    </div>

    <script>
        // Reset view to Hazelwood, MO
        function resetView() {
            const iframe = document.querySelector('iframe');
            iframe.src = "https://web.geolibre.app/#lat=38.787950&lng=-90.374537&zoom=13";
        }
        
        // Open GeoLibre in a new tab
        function openInNewTab() {
            window.open("https://web.geolibre.app/#lat=38.787950&lng=-90.374537&zoom=13", "_blank");
        }
    </script>
</body>
</html>
