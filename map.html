<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hazelwood Fire District Map</title>
    
    <!-- Anti-Cache Code -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css?v=1">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a2a6c, #b21f1f, #fdbb2d);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 10px;
        }
        
        .container {
            max-width: 1200px;
            width: 100%;
            margin: 0 auto;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }
        
        .header {
            text-align: center;
            padding: 15px;
            color: white;
        }
        
        .title {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 10px;
            text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.5);
        }
        
        .subtitle {
            font-size: 1.2rem;
            margin-bottom: 15px;
        }
        
        .map-container {
            flex-grow: 1;
            background: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            margin-bottom: 15px;
            min-height: 400px;
            position: relative;
        }
        
        #map {
            width: 100%;
            height: 100%;
            min-height: 400px;
            position: absolute;
            top: 0;
            bottom: 0;
            left: 0;
            right: 0;
        }
        
        .footer {
            text-align: center;
            padding: 10px;
            color: rgba(255, 255, 255, 0.8);
        }
        
        .controls {
            display: flex;
            justify-content: center;
            margin-bottom: 10px;
            flex-wrap: wrap;
        }
        
        .button {
            background: rgba(255, 255, 255, 0.9);
            color: #333;
            border: none;
            padding: 8px 15px;
            margin: 0 5px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s ease;
        }
        
        .button:hover {
            background: linear-gradient(45deg, #f093fb, #f5576c);
            color: white;
        }
        
        #coordinates {
            position: absolute;
            top: 10px;
            right: 10px;
            z-index: 1000;
            background: white;
            padding: 5px;
            font-size: 12px;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }
        
        .station-info {
            position: absolute;
            bottom: 10px;
            left: 10px;
            z-index: 1000;
            background: white;
            padding: 5px;
            font-size: 12px;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }
        
        @media (max-width: 768px) {
            .title { font-size: 1.8rem; }
            .subtitle { font-size: 1rem; }
            .button { 
                padding: 6px 10px;
                font-size: 12px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1 class="title">Hazelwood Fire District Map</h1>
            <div class="subtitle">City of Hazelwood, Missouri</div>
        </div>
        
        <div class="controls">
            <button class="button" onclick="resetView()">Reset View</button>
            <button class="button" onclick="showFireStation()">Fire Station</button>
            <button class="button" onclick="showCityHall()">City Hall</button>
        </div>
        
        <div class="map-container">
            <div id="map"></div>
            <div id="coordinates"></div>
            <div id="station-info"></div>
        </div>
        
        <div class="footer">
            <p>Hazelwood Fire Department | Fire Marshal Division</p>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js?v=1"></script>
    <script>
        // Anti-cache for map tiles
        L.TileLayer.prototype._loadTile = function (tile, tilePoint) {
            this._adjustTilePoint(tilePoint);
            tile._layer = this;
            tile._tilePoint = tilePoint;
            this._tileBg.appendChild(tile);
            this.fire('tileload', {tile: tile, url: this.getTileUrl(tilePoint)});
            // Add timestamp to prevent caching
            var url = this.getTileUrl(tilePoint);
            url += (url.indexOf('?') === -1 ? '?' : '&') + 't=' + new Date().getTime();
            this._tileImg.src = url;
        };
        
        // Initialize the map centered on Hazelwood, MO 
        const map = L.map('map').setView([38.787950, -90.374537], 13);
        
        // Add OpenStreetMap tiles
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
        }).addTo(map);
        
        // Fire Station 2: 6800 Howdershell Road, Hazelwood, MO (based on your screenshot)
        const fireStationMarker = L.marker([38.787950, -90.374537]).addTo(map)
            .bindPopup('<b>Hazelwood Fire Station 2</b><br>6800 Howdershell Road');
        
        // City Hall: 415 Elm Grove Lane, Hazelwood, MO (corrected coordinates)
        const cityHallMarker = L.marker([38.78617, -90.35412]).addTo(map)
            .bindPopup('<b>City Hall</b><br>415 Elm Grove Lane');
        
        // Function to reset view to default
        function resetView() {
            map.setView([38.787950, -90.374537], 13);
        }
        
        // Function to show fire station
        function showFireStation() {
            map.setView([38.787950, -90.374537], 18);
            fireStationMarker.openPopup();
            updateStationInfo("Fire Station 2", "6800 Howdershell Road");
        }
        
        // Function to show city hall
        function showCityHall() {
            map.setView([38.78617, -90.35412], 18);
            cityHallMarker.openPopup();
            updateStationInfo("City Hall", "415 Elm Grove Lane");
        }
        
        // Update station info display
        function updateStationInfo(name, address) {
            document.getElementById('station-info').innerHTML = 
                `<strong>${name}</strong><br>${address}`;
        }
        
        // Add sample inspection locations with corrected coordinates
        const inspectionLocations = [
            {lat: 38.787950, lng: -90.374537, name: "Fire Station 2", status: "Compliant"},
            {lat: 38.78617, lng: -90.35412, name: "City Hall", status: "Compliant"},
            {lat: 38.7850, lng: -90.3740, name: "Hazelwood Community Center", status: "Non-Compliant"}
        ];
        
        // Add markers for inspection locations
        inspectionLocations.forEach(location => {
            const markerColor = location.status === "Compliant" ? "green" : "red";
            
            const icon = L.divIcon({
                className: 'custom-div-icon',
                html: `<div style="background-color: ${markerColor}; width: 12px; height: 12px; border-radius: 50%; border: 2px solid white;"></div>`,
                iconSize: [12, 12],
                iconAnchor: [6, 6]
            });
            
            const marker = L.marker([location.lat, location.lng], {icon: icon}).addTo(map);
            marker.bindPopup(`<b>${location.name}</b><br>Status: ${location.status}`);
        });
        
        // Add coordinate display when clicking on the map
        map.on('click', function(e) {
            document.getElementById('coordinates').innerHTML = 
                "Lat: " + e.latlng.lat.toFixed(6) + "<br>Lng: " + e.latlng.lng.toFixed(6);
        });
        
        // Log coordinates for debugging
        console.log("Fire Station coordinates: [38.787950, -90.374537]");
        console.log("Fire Station actual position: " + fireStationMarker.getLatLng());
        
        console.log("City Hall coordinates: [38.78617, -90.35412]");
        console.log("City Hall actual position: " + cityHallMarker.getLatLng());
        
        // Initial station info
        updateStationInfo("Click buttons to see locations", "Information will appear here");
    </script>
</body>
</html>
