<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hazelwood Fire District Map</title>
    <!-- Using Leaflet 1.7.1 to avoid white grid lines issue -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css" />
    <!-- No-caching headers -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a2a6c, #b21f1f, #fdbb2d);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 10px;
        }
        
        .container {
            max-width: 1200px;
            width: 100%;
            margin: 0 auto;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }
        
        .header {
            text-align: center;
            padding: 15px;
            color: white;
        }
        
        .title {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 10px;
            text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.5);
        }
        
        .subtitle {
            font-size: 1.2rem;
            margin-bottom: 15px;
        }
        
        .map-container {
            flex-grow: 1;
            background: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            margin-bottom: 15px;
            min-height: 400px;
            position: relative;
        }
        
        #map {
            width: 100%;
            height: 100%;
            min-height: 400px;
            /* Fix for white rectangle issue */
            position: absolute;
            top: 0;
            bottom: 0;
            left: 0;
            right: 0;
        }
        
        .footer {
            text-align: center;
            padding: 10px;
            color: rgba(255, 255, 255, 0.8);
        }
        
        .controls {
            display: flex;
            justify-content: center;
            margin-bottom: 10px;
            flex-wrap: wrap;
        }
        
        .button {
            background: rgba(255, 255, 255, 0.9);
            color: #333;
            border: none;
            padding: 8px 15px;
            margin: 0 5px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s ease;
        }
        
        .button:hover {
            background: linear-gradient(45deg, #f093fb, #f5576c);
            color: white;
        }
        
        /* Coordinate display style */
        #coordinates {
            position: absolute;
            top: 10px;
            right: 10px;
            z-index: 1000;
            background: white;
            padding: 5px;
            font-size: 12px;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }
        
        .station-info {
            position: absolute;
            bottom: 10px;
            left: 10px;
            z-index: 1000;
            background: white;
            padding: 5px;
            font-size: 12px;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }
        
        @media (max-width: 768px) {
            .title { font-size: 1.8rem; }
            .subtitle { font-size: 1rem; }
            .button { 
                padding: 6px 10px;
                font-size: 12px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1 class="title">Hazelwood Fire District Map</h1>
            <div class="subtitle">City of Hazelwood, Missouri</div>
        </div>
        
        <div class="controls">
            <button class="button" onclick="resetView()">Reset View</button>
            <button class="button" onclick="showFireStation1()">Fire Station 1</button>
            <button class="button" onclick="showFireStation2()">Fire Station 2</button>
            <button class="button" onclick="showCityHall()">City Hall</button>
        </div>
        
        <div class="map-container">
            <div id="map"></div>
            <div id="coordinates"></div>
            <div id="station-info"></div>
        </div>
        
        <div class="footer">
            <p>Hazelwood Fire Department | Fire Marshal Division</p>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>
    <script>
        // Fix for white rectangle issue - this applies the workaround from search results
        if (window?.chrome !== undefined) {
            const originalInitTile = L.GridLayer.prototype._initTile;
            L.GridLayer.include({
                _initTile: function (tile) {
                    originalInitTile.call(this, tile);
                    const tileSize = this.getTileSize();
                    tile.style.width = `${tileSize.x + 1}px`;
                    tile.style.height = `${tileSize.y + 1}px`;
                }
            });
        }
        
        // Initialize the map centered on Hazelwood, MO 
        const map = L.map('map').setView([38.7796, -90.3690], 13);
        
        // Add OpenStreetMap tiles
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
        }).addTo(map);
        
        // Precise coordinates derived from official addresses
        // Fire Station 1: 6100 North Lindbergh Boulevard
        const fireStation1Marker = L.marker([38.7946, -90.3645]).addTo(map)
            .bindPopup('<b>Fire Station 1</b><br>6100 North Lindbergh Boulevard');
        
        // Fire Station 2: 6800 Howdershell Road
        const fireStation2Marker = L.marker([38.7678, -90.3736]).addTo(map)
            .bindPopup('<b>Fire Station 2</b><br>6800 Howdershell Road');
        
        // City Hall: 415 Elm Grove Lane
        const cityHallMarker = L.marker([38.7769, -90.3701]).addTo(map)
            .bindPopup('<b>City Hall</b><br>415 Elm Grove Lane');
        
        // Function to reset view to default
        function resetView() {
            map.setView([38.7796, -90.3690], 13);
        }
        
        // Function to show fire station 1
        function showFireStation1() {
            map.setView([38.7946, -90.3645], 16);
            fireStation1Marker.openPopup();
            updateStationInfo("Fire Station 1", "6100 North Lindbergh Boulevard");
        }
        
        // Function to show fire station 2
        function showFireStation2() {
            map.setView([38.7678, -90.3736], 16);
            fireStation2Marker.openPopup();
            updateStationInfo("Fire Station 2", "6800 Howdershell Road");
        }
        
        // Function to show city hall
        function showCityHall() {
            map.setView([38.7769, -90.3701], 16);
            cityHallMarker.openPopup();
            updateStationInfo("City Hall", "415 Elm Grove Lane");
        }
        
        // Update station info display
        function updateStationInfo(name, address) {
            document.getElementById('station-info').innerHTML = 
                `<strong>${name}</strong><br>${address}`;
        }
        
        // Create a boundary for Hazelwood (approximate)
        const hazelwoodBounds = [
            [38.7500, -90.3900], // Southwest corner
            [38.8100, -90.3500]  // Northeast corner
        ];
        
        // Add a rectangle showing approximate city boundaries
        L.rectangle(hazelwoodBounds, {
            color: "#b21f1f",
            weight: 2,
            opacity: 0.5,
            fillOpacity: 0.1
        }).addTo(map);
        
        // Add sample inspection locations with corrected coordinates
        const inspectionLocations = [
            {lat: 38.7946, lng: -90.3645, name: "Fire Station 1", status: "Compliant"},
            {lat: 38.7678, lng: -90.3736, name: "Fire Station 2", status: "Compliant"},
            {lat: 38.7769, lng: -90.3701, name: "City Hall", status: "Compliant"},
            {lat: 38.7850, lng: -90.3740, name: "Hazelwood Community Center", status: "Non-Compliant"}
        ];
        
        // Add markers for inspection locations
        inspectionLocations.forEach(location => {
            const markerColor = location.status === "Compliant" ? "green" : "red";
            
            const icon = L.divIcon({
                className: 'custom-div-icon',
                html: `<div style="background-color: ${markerColor}; width: 12px; height: 12px; border-radius: 50%; border: 2px solid white;"></div>`,
                iconSize: [12, 12],
                iconAnchor: [6, 6]
            });
            
            const marker = L.marker([location.lat, location.lng], {icon: icon}).addTo(map);
            marker.bindPopup(`<b>${location.name}</b><br>Status: ${location.status}`);
        });
        
        // Add coordinate display when clicking on the map
        map.on('click', function(e) {
            document.getElementById('coordinates').innerHTML = 
                "Lat: " + e.latlng.lat.toFixed(6) + "<br>Lng: " + e.latlng.lng.toFixed(6);
        });
        
        // Log coordinates for debugging
        console.log("Fire Station 1 coordinates: [38.7946, -90.3645]");
        console.log("Fire Station 1 actual position: " + fireStation1Marker.getLatLng());
        
        console.log("Fire Station 2 coordinates: [38.7678, -90.3736]");
        console.log("Fire Station 2 actual position: " + fireStation2Marker.getLatLng());
        
        console.log("City Hall coordinates: [38.7769, -90.3701]");
        console.log("City Hall actual position: " + cityHallMarker.getLatLng());
        
        // Ensure the map renders properly
        setTimeout(function() {
            map.invalidateSize();
        }, 100);
        
        // Initial station info
        updateStationInfo("Click buttons to see locations", "Information will appear here");
    </script>
</body>
</html>
