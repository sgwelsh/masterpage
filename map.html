<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hazelwood Fire District Map</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a2a6c, #b21f1f, #fdbb2d);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 10px;
        }
        
        .container {
            max-width: 1200px;
            width: 100%;
            margin: 0 auto;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }
        
        .header {
            text-align: center;
            padding: 15px;
            color: white;
        }
        
        .title {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 10px;
            text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.5);
        }
        
        .subtitle {
            font-size: 1.2rem;
            margin-bottom: 15px;
        }
        
        .map-container {
            flex-grow: 1;
            background: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            margin-bottom: 15px;
            min-height: 400px;
        }
        
        #map {
            width: 100%;
            height: 100%;
            min-height: 400px;
        }
        
        .footer {
            text-align: center;
            padding: 10px;
            color: rgba(255, 255, 255, 0.8);
        }
        
        .controls {
            display: flex;
            justify-content: center;
            margin-bottom: 10px;
        }
        
        .button {
            background: rgba(255, 255, 255, 0.9);
            color: #333;
            border: none;
            padding: 8px 15px;
            margin: 0 5px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s ease;
        }
        
        .button:hover {
            background: linear-gradient(45deg, #f093fb, #f5576c);
            color: white;
        }
        
        @media (max-width: 768px) {
            .title { font-size: 1.8rem; }
            .subtitle { font-size: 1rem; }
            .button { 
                padding: 6px 10px;
                font-size: 12px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1 class="title">Hazelwood Fire District Map</h1>
            <div class="subtitle">City of Hazelwood, Missouri</div>
        </div>
        
        <div class="controls">
            <button class="button" onclick="resetView()">Reset View</button>
            <button class="button" onclick="showFireStation()">Fire Station</button>
            <button class="button" onclick="showCityHall()">City Hall</button>
        </div>
        
        <div class="map-container">
            <div id="map"></div>
        </div>
        
        <div class="footer">
            <p>Hazelwood Fire Department | Fire Marshal Division</p>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // Initialize the map centered on Hazelwood, MO
        const map = L.map('map').setView([38.7754, -90.3663], 13);
        
        // Add OpenStreetMap tiles
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
        }).addTo(map);
        
        // Add a marker for Hazelwood Fire Department
        const fireStationMarker = L.marker([38.7754, -90.3663]).addTo(map)
            .bindPopup('<b>Hazelwood Fire Department</b><br>Fire Marshal Division');
        
        // Add marker for City Hall
        const cityHallMarker = L.marker([38.7750, -90.3600]).addTo(map)
            .bindPopup('<b>Hazelwood City Hall</b><br>City Administration');
        
        // Function to reset view to default
        function resetView() {
            map.setView([38.7754, -90.3663], 13);
        }
        
        // Function to show fire station
        function showFireStation() {
            map.setView([38.7754, -90.3663], 15);
            fireStationMarker.openPopup();
        }
        
        // Function to show city hall
        function showCityHall() {
            map.setView([38.7750, -90.3600], 15);
            cityHallMarker.openPopup();
        }
        
        // Create a boundary for Hazelwood (approximate)
        const hazelwoodBounds = [
            [38.7600, -90.3800], // Southwest corner
            [38.7900, -90.3500]  // Northeast corner
        ];
        
        // Add a rectangle showing approximate city boundaries
        L.rectangle(hazelwoodBounds, {
            color: "#b21f1f",
            weight: 2,
            opacity: 0.5,
            fillOpacity: 0.1
        }).addTo(map);
        
        // Add some sample inspection locations (you can replace these with real data)
        const inspectionLocations = [
            {lat: 38.7800, lng: -90.3650, name: "ABC Manufacturing", status: "Compliant"},
            {lat: 38.7700, lng: -90.3700, name: "XYZ Shopping Center", status: "Non-Compliant"},
            {lat: 38.7750, lng: -90.3600, name: "Hazelwood High School", status: "Compliant"},
            {lat: 38.7700, lng: -90.3550, name: "Medical Center", status: "Compliant"}
        ];
        
        // Add markers for inspection locations
        inspectionLocations.forEach(location => {
            const markerColor = location.status === "Compliant" ? "green" : "red";
            
            const icon = L.divIcon({
                className: 'custom-div-icon',
                html: `<div style="background-color: ${markerColor}; width: 12px; height: 12px; border-radius: 50%; border: 2px solid white;"></div>`,
                iconSize: [12, 12],
                iconAnchor: [6, 6]
            });
            
            const marker = L.marker([location.lat, location.lng], {icon: icon}).addTo(map);
            marker.bindPopup(`<b>${location.name}</b><br>Status: ${location.status}`);
        });
    </script>
</body>
</html>
