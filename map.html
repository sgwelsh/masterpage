<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hazelwood Fire District Map</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css" />
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a2a6c, #b21f1f, #fdbb2d);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 10px;
        }
        
        .container {
            max-width: 1200px;
            width: 100%;
            margin: 0 auto;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }
        
        .header {
            text-align: center;
            padding: 15px;
            color: white;
        }
        
        .title {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 10px;
            text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.5);
        }
        
        .subtitle {
            font-size: 1.2rem;
            margin-bottom: 15px;
        }
        
        .map-container {
            flex-grow: 1;
            background: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            margin-bottom: 15px;
            min-height: 400px;
            position: relative;
        }
        
        #map {
            width: 100%;
            height: 100%;
            min-height: 400px;
            position: absolute;
            top: 0;
            bottom: 0;
            left: 0;
            right: 0;
        }
        
        .footer {
            text-align: center;
            padding: 10px;
            color: rgba(255, 255, 255, 0.8);
        }
        
        .controls {
            display: flex;
            justify-content: center;
            margin-bottom: 10px;
            flex-wrap: wrap;
        }
        
        .button {
            background: rgba(255, 255, 255, 0.9);
            color: #333;
            border: none;
            padding: 8px 15px;
            margin: 0 5px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s ease;
        }
        
        .button:hover {
            background: linear-gradient(45deg, #f093fb, #f5576c);
            color: white;
        }
        
        #coordinates {
            position: absolute;
            top: 10px;
            right: 10px;
            z-index: 1000;
            background: white;
            padding: 5px;
            font-size: 12px;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }
        
        .instructions {
            position: absolute;
            bottom: 10px;
            left: 10px;
            z-index: 1000;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 8px;
            font-size: 12px;
            border-radius: 5px;
            max-width: 300px;
        }
        
        @media (max-width: 768px) {
            .title { font-size: 1.8rem; }
            .subtitle { font-size: 1rem; }
            .button { 
                padding: 6px 10px;
                font-size: 12px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1 class="title">Hazelwood Fire District Map</h1>
            <div class="subtitle">City of Hazelwood, Missouri</div>
        </div>
        
        <div class="controls">
            <button class="button" onclick="resetView()">Reset View</button>
            <button class="button" onclick="clearAllMarkers()">Clear All Markers</button>
        </div>
        
        <div class="map-container">
            <div id="map"></div>
            <div id="coordinates"></div>
            <div id="instructions">
                <strong>Instructions:</strong><br>
                Click anywhere on the map to place a marker.<br>
                Click on a marker to delete it.
            </div>
        </div>
        
        <div class="footer">
            <p>Hazelwood Fire Department | Fire Marshal Division</p>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>
    <script>
        // Initialize the map centered on Hazelwood, MO 
        const map = L.map('map').setView([38.787950, -90.374537], 13);
        
        // Add OpenStreetMap tiles
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
        }).addTo(map);
        
        // Array to store custom markers
        let customMarkers = [];
        
        // Load saved markers from localStorage when page loads
        function loadSavedMarkers() {
            const savedMarkers = localStorage.getItem('mapCustomMarkers');
            if (savedMarkers) {
                customMarkers = JSON.parse(savedMarkers);
                customMarkers.forEach(markerData => {
                    const marker = L.marker([markerData.lat, markerData.lng]).addTo(map);
                    marker.bindPopup(`<b>${markerData.name}</b><br>${markerData.description || ''}`);
                    marker.on('click', function() {
                        if (confirm('Delete this marker?')) {
                            map.removeLayer(marker);
                            const index = customMarkers.findIndex(m => 
                                m.lat === markerData.lat && m.lng === markerData.lng);
                            if (index > -1) customMarkers.splice(index, 1);
                            saveMarkers();
                        }
                    });
                });
            }
        }
        
        // Save markers to localStorage
        function saveMarkers() {
            localStorage.setItem('mapCustomMarkers', JSON.stringify(customMarkers));
        }
        
        // Add click event to map
        map.on('click', function(e) {
            const lat = e.latlng.lat;
            const lng = e.latlng.lng;
            
            // Prompt for marker details
            const name = prompt('Enter a name for this location:');
            if (!name) return;
            
            const description = prompt('Enter a description (optional):');
            
            // Create the marker
            const marker = L.marker([lat, lng]).addTo(map);
            marker.bindPopup(`<b>${name}</b><br>${description || ''}`);
            
            // Add to markers array
            customMarkers.push({
                lat: lat,
                lng: lng,
                name: name,
                description: description
            });
            
            // Save to localStorage
            saveMarkers();
            
            // Add click event to marker for deletion
            marker.on('click', function() {
                if (confirm('Delete this marker?')) {
                    map.removeLayer(marker);
                    const index = customMarkers.findIndex(m => 
                        m.lat === lat && m.lng === lng);
                    if (index > -1) customMarkers.splice(index, 1);
                    saveMarkers();
                }
            });
        });
        
        // Load saved markers when page initializes
        loadSavedMarkers();
        
        // Function to reset view to default
        function resetView() {
            map.setView([38.787950, -90.374537], 13);
        }
        
        // Function to clear all markers
        function clearAllMarkers() {
            if (confirm('Clear all markers? This cannot be undone.')) {
                customMarkers = [];
                saveMarkers();
                // Remove all marker layers from map
                map.eachLayer(function(layer) {
                    if (layer instanceof L.Marker) {
                        map.removeLayer(layer);
                    }
                });
            }
        }
        
        // Add coordinate display when clicking on the map
        map.on('click', function(e) {
            document.getElementById('coordinates').innerHTML = 
                "Lat: " + e.latlng.lat.toFixed(6) + "<br>Lng: " + e.latlng.lng.toFixed(6);
        });
        
        // Force map reload on first load
        setTimeout(function() {
            map.invalidateSize();
        }, 100);
    </script>
</body>
</html>
