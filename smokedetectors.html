<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">Smoke Detector Records</title>
    <style>
        /* Default styles */
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            color: #333;
        }
        
        h1 {
            margin-bottom: 20px;
        }
        
        .search-container {
            margin-bottom: 15px;
        }
        
        .search-container input {
            padding: 8px;
            width: 300px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        
        .table-container {
            overflow-x: auto;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
        }
        
        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }
        
        th {
            font-weight: bold;
            position: relative;
        }
        
        th.sortable {
            cursor: pointer;
        }
        
        th.sortable:hover {
            background-color: #f5f5f5;
        }
        
        th.sortable::after {
            content: " ⇅";
            opacity: 0.3;
        }
        
        th.sorted-asc::after {
            content: " ↑";
            opacity: 1;
        }
        
        th.sorted-desc::after {
            content: " ↓";
            opacity: 1;
        }
        
        .pagination {
            margin-top: 15px;
            display: flex;
            align-items: center;
        }
        
        .pagination button {
            margin-right: 10px;
            padding: 5px 10px;
            background-color: #f1f1f1;
            border: 1px solid #ddd;
            cursor: pointer;
        }
        
        .pagination button:hover {
            background-color: #e1e1e1;
        }
        
        .pagination button.active {
            background-color: #337ab7;
            color: white;
        }
        
        .pagination button:disabled {
            cursor: not-allowed;
            opacity: 0.5;
        }
        
        .config-message {
            background-color: #e2f3ff;
            padding: 10px;
            border-radius: 4px;
            margin-bottom: 15px;
        }
        
        .config-error {
            background-color: #ffe2e2;
            padding: 10px;
            border-radius: 4px;
            margin-bottom: 15px;
        }
        
        /* Will be populated by config.json */
    </style>
</head>
<body>
    <h1 id="page-header">Smoke Detector Records</h1>
    <div id="config-message" class="config-message" style="display: none;"></div>
    <div class="search-container">
        <input type="text" id="search-input" placeholder="Search table...">
    </div>
    <div class="table-container">
        <table id="data-table">
            <thead id="table-head">
                <tr>
                    <!-- Headers will be populated from CSV -->
                </tr>
            </thead>
            <tbody id="table-body">
                <!-- Data will be populated from CSV -->
            </tbody>
        </table>
    </div>
    <div class="pagination" id="pagination">
        <button id="prev-page" disabled>Previous</button>
        <span id="page-info"></span>
        <button id="next-page" disabled>Next</button>
        <select id="rows-per-page">
            <option value="5">5 rows</option>
            <option value="10" selected>10 rows</option>
            <option value="25">25 rows</option>
            <option value="50">50 rows</option>
            <option value="100">100 rows</option>
        </select>
    </div>

    <script>
        // Global variables
        let csvData = [];
        let filteredData = [];
        let headers = [];
        let currentPage = 1;
        let rowsPerPage = 10;
        let config = {};
        let sortColumn = -1;
        let sortDirection = 'asc';

        // Initialize the page
        document.addEventListener('DOMContentLoaded', function() {
            loadConfig();
            document.getElementById('rows-per-page').addEventListener('change', function() {
                rowsPerPage = parseInt(this.value);
                currentPage = 1;
                renderTable();
                updatePagination();
            });
            
            document.getElementById('search-input').addEventListener('input', function() {
                currentPage = 1;
                filterData(this.value);
            });
            
            document.getElementById('prev-page').addEventListener('click', function() {
                if (currentPage > 1) {
                    currentPage--;
                    renderTable();
                    updatePagination();
                }
            });
            
            document.getElementById('next-page').addEventListener('click', function() {
                const maxPage = Math.ceil(filteredData.length / rowsPerPage);
                if (currentPage < maxPage) {
                    currentPage++;
                    renderTable();
                    updatePagination();
                }
            });
        });

        // Load configuration from config.json
        function loadConfig() {
            fetch('config.json')
                .then(response => {
                    if (!response.ok) {
                        throw new Error('Config file not found');
                    }
                    return response.json();
                })
                .then(data => {
                    config = data;
                    applyConfig();
                    loadCSV();
                })
                .catch(error => {
                    // Show error message but continue with default config
                    showConfigError(error.message);
                    loadCSV();
                });
        }

        // Apply configuration settings
        function applyConfig() {
            // Set page title and header
            if (config.pageTitle) {
                document.getElementById('page-title').textContent = config.pageTitle;
            }
            if (config.pageHeader) {
                document.getElementById('page-header').textContent = config.pageHeader;
            }
            
            // Apply table styles
            const style = document.createElement('style');
            let cssRules = '';
            
            if (config.tableStyles) {
                const styles = config.tableStyles;
                
                // Header styles
                if (styles.headerColor) {
                    cssRules += `th { background-color: ${styles.headerColor} !important; }`;
                }
                if (styles.headerTextColor) {
                    cssRules += `th { color: ${styles.headerTextColor} !important; }`;
                }
                if (styles.headerFontSize) {
                    cssRules += `th { font-size: ${styles.headerFontSize} !important; }`;
                }
                
                // Cell styles
                if (styles.cellBackgroundColor) {
                    cssRules += `td { background-color: ${styles.cellBackgroundColor} !important; }`;
                }
                if (styles.cellTextColor) {
                    cssRules += `td { color: ${styles.cellTextColor} !important; }`;
                }
                if (styles.cellFontSize) {
                    cssRules += `td { font-size: ${styles.cellFontSize} !important; }`;
                }
                
                // Alternating row colors
                if (styles.alternatingRowColors && styles.alternatingRowColors.length >= 2) {
                    cssRules += `tr:nth-child(even) { background-color: ${styles.alternatingRowColors[1]} !important; }`;
                    cssRules += `tr:nth-child(odd) { background-color: ${styles.alternatingRowColors[0]} !important; }`;
                }
                
                // Border styles
                if (styles.borderColor) {
                    cssRules += `table, th, td { border-color: ${styles.borderColor} !important; }`;
                }
                if (styles.borderWidth) {
                    cssRules += `table, th, td { border-width: ${styles.borderWidth} !important; }`;
                }
            }
            
            // Column widths
            if (config.columnWidths) {
                config.columnWidths.forEach((width, index) => {
                    cssRules += `th:nth-child(${index + 1}), td:nth-child(${index + 1}) { width: ${width} !important; }`;
                });
            }
            
            style.textContent = cssRules;
            document.head.appendChild(style);
            
            // Set rows per page
            if (config.rowsPerPage) {
                rowsPerPage = config.rowsPerPage;
                document.getElementById('rows-per-page').value = rowsPerPage;
            }
            
            // Show success message
            showConfigMessage('Configuration loaded successfully');
        }

        // Show configuration message
        function showConfigMessage(message) {
            const configDiv = document.getElementById('config-message');
            configDiv.textContent = message;
            configDiv.className = 'config-message';
            configDiv.style.display = 'block';
            setTimeout(() => {
                configDiv.style.display = 'none';
            }, 3000);
        }

        // Show configuration error
        function showConfigError(message) {
            const configDiv = document.getElementById('config-message');
            configDiv.textContent = 'Configuration error: ' + message + '. Using default settings.';
            configDiv.className = 'config-error';
            configDiv.style.display = 'block';
        }

        // Load CSV data
        function loadCSV() {
            fetch('smokes.csv')
                .then(response => {
                    if (!response.ok) {
                        throw new Error('CSV file not found');
                    }
                    return response.text();
                })
                .then(text => {
                    parseCSV(text);
                    filterData('');
                })
                .catch(error => {
                    // Show error message in the table
                    document.getElementById('table-body').innerHTML = `<tr><td colspan="100%">Error loading CSV file: ${error.message}</td></tr>`;
                });
        }

        // Parse CSV text
        function parseCSV(text) {
            const lines = text.split('\n').filter(line => line.trim() !== '');
            
            if (lines.length < 1) {
                document.getElementById('table-body').innerHTML = '<tr><td colspan="100%">CSV file is empty</td></tr>';
                return;
            }
            
            // Parse headers
            headers = parseCSVLine(lines[0]);
            
            // Parse data rows
            csvData = [];
            for (let i = 1; i < lines.length; i++) {
                const row = parseCSVLine(lines[i]);
                if (row.length > 0) {
                    csvData.push(row);
                }
            }
            
            // Set initial filtered data
            filteredData = csvData;
            
            // Create table headers
            createTableHeaders();
        }

        // Parse a CSV line (handles commas in quoted strings)
        function parseCSVLine(line) {
            const result = [];
            let currentValue = '';
            let inQuotes = false;
            
            for (let i = 0; i < line.length; i++) {
                const char = line[i];
                
                if (char === '"' && (i === 0 || line[i-1] === ',' || line[i+1] === ',' || i === line.length - 1)) {
                    inQuotes = !inQuotes;
                } else if (char === ',' && !inQuotes) {
                    result.push(currentValue.trim());
                    currentValue = '';
                } else {
                    currentValue += char;
                }
            }
            
            // Add the last value
            result.push(currentValue.trim());
            
            return result;
        }

        // Create table headers
        function createTableHeaders() {
            const headerRow = document.getElementById('table-head').querySelector('tr');
            headerRow.innerHTML = '';
            
            headers.forEach((header, index) => {
                const th = document.createElement('th');
                th.textContent = header;
                
                // Make sortable if enabled in config
                if (!config.sortableColumns || config.sortableColumns[index] !== false) {
                    th.classList.add('sortable');
                    th.addEventListener('click', () => sortByColumn(index));
                }
                
                headerRow.appendChild(th);
            });
        }

        // Sort by column
        function sortByColumn(columnIndex) {
            // Update sort direction if clicking the same column
            if (sortColumn === columnIndex) {
                sortDirection = sortDirection === 'asc' ? 'desc' : 'asc';
            } else {
                sortColumn = columnIndex;
                sortDirection = 'asc';
            }
            
            // Update header classes
            document.querySelectorAll('th').forEach((th, index) => {
                th.classList.remove('sorted-asc', 'sorted-desc');
                if (index === sortColumn) {
                    th.classList.add(sortDirection === 'asc' ? 'sorted-asc' : 'sorted-desc');
                }
            });
            
            // Sort the data
            filteredData.sort((a, b) => {
                const valueA = a[columnIndex].toLowerCase();
                const valueB = b[columnIndex].toLowerCase();
                
                if (valueA < valueB) {
                    return sortDirection === 'asc' ? -1 : 1;
                } else if (valueA > valueB) {
                    return sortDirection === 'asc' ? 1 : -1;
                } else {
                    return 0;
                }
            });
            
            // Reset to first page and render
            currentPage = 1;
            renderTable();
            updatePagination();
        }

        // Filter data based on search input
        function filterData(searchTerm) {
            if (searchTerm === '') {
                filteredData = [...csvData];
            } else {
                const term = searchTerm.toLowerCase();
                filteredData = csvData.filter(row => {
                    return row.some(cell => cell.toLowerCase().includes(term));
                });
            }
            
            renderTable();
            updatePagination();
        }

        // Render table
        function renderTable() {
            const tableBody = document.getElementById('table-body');
            tableBody.innerHTML = '';
            
            // Calculate the start and end index for the current page
            const startIndex = (currentPage - 1) * rowsPerPage;
            const endIndex = Math.min(startIndex + rowsPerPage, filteredData.length);
            
            // Add rows for the current page
            for (let i = startIndex; i < endIndex; i++) {
                const row = document.createElement('tr');
                
                filteredData[i].forEach((cell, index) => {
                    const td = document.createElement('td');
                    
                    // Apply column-specific formatting if configured
                    if (config.columnFormats && config.columnFormats[index]) {
                        const format = config.columnFormats[index];
                        
                        // URL formatting
                        if (format.type === 'url' && cell) {
                            const link = document.createElement('a');
                            link.href = cell;
                            link.textContent = cell;
                            link.target = '_blank';
                            td.appendChild(link);
                        } 
                        // Date formatting
                        else if (format.type === 'date' && cell) {
                            const date = new Date(cell);
                            if (!isNaN(date.getTime())) {
                                td.textContent = date.toLocaleDateString();
                            } else {
                                td.textContent = cell;
                            }
                        } 
                        // Default: just text
                        else {
                            td.textContent = cell;
                        }
                    } 
                    // No specific formatting configured
                    else {
                        td.textContent = cell;
                    }
                    
                    row.appendChild(td);
                });
                
                tableBody.appendChild(row);
            }
            
            // If no data is found
            if (filteredData.length === 0) {
                const row = document.createElement('tr');
                const td = document.createElement('td');
                td.colSpan = headers.length;
                td.textContent = 'No matching data found';
                row.appendChild(td);
                tableBody.appendChild(row);
            }
        }

        // Update pagination controls
        function updatePagination() {
            const maxPage = Math.ceil(filteredData.length / rowsPerPage);
            document.getElementById('prev-page').disabled = currentPage <= 1;
            document.getElementById('next-page').disabled = currentPage >= maxPage;
            document.getElementById('page-info').textContent = `Page ${currentPage} of ${maxPage || 1}`;
        }
    </script>
</body>
</html>
